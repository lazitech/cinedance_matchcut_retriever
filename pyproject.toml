[project]
name = "matchcut-retriever"
version = "0.1.0"
description = "Retrieve CineDance movie shots whose objects can form a shape match cut with a clicked subject."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10",
]

[project.optional-dependencies]
# Model-dependent pieces; installed on the GPU server only.
gpu = [
    "torch>=2.4,<2.15",
    "torchvision>=0.19",
    "transformers>=4.56",
    "scipy>=1.11",
    "huggingface_hub>=0.24",
]

# Gradio query UI (stage 7); run on the GPU server, CPU inference is fine.
app = [
    "gradio>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
# files.pythonhosted.org is very slow or unreachable from both dev machines; the lock records
# this mirror's URLs, so `uv sync` works the same everywhere.
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
# The GPU server's driver supports CUDA <= 12.8; PyPI's default torch wheels need CUDA 13.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchcut_retriever"]

[tool.pytest.ini_options]
testpaths = ["tests"]
