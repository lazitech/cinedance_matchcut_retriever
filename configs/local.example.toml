# Copy to configs/local.toml (git-ignored) and adjust for this machine.
# Values below are the GPU server's layout.

[paths]
# CineDance live-action clips: <video_root>/<video_id>.mp4 (read-only)
video_root = "/data0/lvanzhe/CineDance_01/video_live"
# Shard manifests and labels from the download job (read-only)
manifest_dir = "/data0/lvanzhe/CineDance_01/manifest"
# Extracted official annotations, one <video_id>.json per clip (shared by all libraries)
annotation_dir = "/data2/lvanzhe/matchcut_library/raw/annotations"
# One retrieval library: shots, keyframes, objects, indexes, experiments.
# dev500 = the 500-clip development set; the full library will get its own root.
library_root = "/data2/lvanzhe/matchcut_library/dev500"
# Hugging Face cache for model weights
hf_cache = "/data2/lvanzhe/hf_cache"
